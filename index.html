<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c0709" id="tmeta">
<title>Sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@500;700&family=Inter:wght@500;600;700;800;900&family=Fredoka:wght@500&family=Press+Start+2P&family=Orbitron:wght@700&family=Bangers&family=Creepster&family=Permanent+Marker&family=Pacifico&family=Nunito:wght@700&family=Oswald:wght@500&family=Merriweather:wght@700&family=Roboto+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css"></head><body>

<div id="auth" class="screen on">
 <div class="card" id="acard">
  <div class="logo">SANDBOX</div>
  <div class="tabs"><button class="btn act" data-a="tab" data-v="login">Masuk</button><button class="btn" data-a="tab" data-v="reg">Daftar</button></div>
  <label>Username</label><input type="text" id="u" autocomplete="username" maxlength="14" autocapitalize="off">
  <label>Password</label><input type="password" id="pw" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn w g" id="go" data-a="auth">Masuk</button>
 </div>
</div>

<div id="app" class="screen">
 <header><div class="logo">SANDBOX</div><div class="pill" id="buxp">0</div></header>
 <main id="main"></main>
 <nav id="nav"></nav>
</div>

<div id="game" class="screen">
 <canvas id="cv"></canvas>
 <div id="jzone"><div id="joy"><div id="knob"></div></div></div>
 <div class="hud" id="topl"><button class="btn ib c" data-a="pause">☰</button><button class="btn ib" data-a="chat">Chat</button><button class="btn ib p" data-a="cam" id="camb">Cam</button></div>
 <div class="hud" id="topr"><div class="pill" id="net" style="font-size:13px">Solo</div></div>
 <div class="hud" id="chatlog"></div>
 <div class="hud" id="chatbox"><input type="text" id="ci" placeholder="Ketik pesan..." maxlength="80"><button class="btn g" data-a="send">Kirim</button></div>
 <button class="btn" id="jump">LOMPAT</button>
 <div id="pause"><div class="card"><h2>Menu</h2>
  <div id="plist"></div>
  <button class="btn g" data-a="resume">▶ Lanjut</button>
  <button class="btn c" data-a="cam">Ganti Kamera</button>
  <button class="btn o" data-a="respawn">↺ Ulang Posisi</button>
  <button class="btn p" data-a="leave"> Keluar Game</button></div></div>
</div>
<div id="toast"></div>
<div id="ed" class="screen">
 <div id="etb">
  <button class="btn sm c" data-a="edexit">←</button><b id="etitle">Studio</b>
  <button class="btn sm" data-a="tool" data-v="select" title="Pilih (1)"></button><button class="btn sm on" data-a="tool" data-v="move" title="Pindah (2)">✥</button><button class="btn sm" data-a="tool" data-v="rot" title="Putar (3)">⟳</button><button class="btn sm" data-a="tool" data-v="scale" title="Skala (4)">⤢</button>
  <button class="btn sm" data-a="undo" title="Undo">↶</button><button class="btn sm" data-a="yup" title="Naik">▲</button><button class="btn sm" data-a="ydn" title="Turun">▼</button>
  <select id="snap" title="Snap"><option value="0.1">Snap .1</option><option value="0.5">Snap .5</option><option value="1" selected>Snap 1</option><option value="2">Snap 2</option></select>
  <span style="flex:1"></span>
  <button class="btn sm g" data-a="edtest">▶ Test</button><button class="btn sm" data-a="edsave">Simpan</button><button class="btn sm p" id="pubb" data-a="edpub">Publish</button>
 </div>
 <div id="ebody">
  <div id="tbx" class="pan"></div>
  <div id="vp"><canvas id="scv"></canvas><div id="outp"></div></div>
  <div id="rgt" class="pan"><div id="expl"></div><div id="props"></div></div>
 </div>
 <div id="rotov"><div class="ph">↻</div><div>Putar perangkatmu ke <b>landscape</b><br>untuk memakai Sandbox Studio</div><button class="btn" data-a="edexit">← Keluar</button></div>
</div>
<input type="file" id="fi" accept="image/*" hidden><input type="file" id="imp" accept=".json,application/json" hidden>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="firebase-config.js"></script>


















































































<script src="models.js"></script>
<script src="app.js"></script>
</body></html>
